d6cb88577863cf01f63a5b0".match(/.{12}/g));

const $ = id => document.getElementById(id);
const configured = !String(firebaseConfig.apiKey || "").startsWith("PASTE");
let db = null;
if (configured) {
  const app = initializeApp(firebaseConfig);
  db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
}

/* ---------- setup ---------- */
let gate = localStorage.getItem("gate"), num = localStorage.getItem("num");
function fillNums() {
  const n = +$("gateSel").selectedOptions[0].dataset.n;
  $("numSel").innerHTML = Array.from({length: n}, (_, i) => `<option>${i + 1}</option>`).join("");
}
$("gateSel").onchange = fillNums;
$("saveSetup").onclick = () => {
  gate = $("gateSel").value; num = $("numSel").value;
  localStorage.setItem("gate", gate); localStorage.setItem("num", num);
  showScan();
};
$("changeBtn").onclick = async () => { await stopCam(); $("scan").classList.add("hidden"); showSetup(); };
function showSetup() { fillNums(); $("setup").classList.remove("hidden"); }
function showScan() {
  $("setup").classList.add("hidden"); $("scan").classList.remove("hidden");
  $("whoami").textContent = `${gate} · Scanner ${num}`;
  if (!configured) { $("warn").textContent = "Not connected to the database yet — scans can't be checked for duplicates. Ask the organiser to finish setup."; $("warn").classList.remove("hidden"); }
  refreshCount();
}

/* ---------- network indicator ---------- */
function net() { const on = navigator.onLine; $("net").textContent = on ? "online" : "OFFLINE"; $("net").className = on ? "on" : "off"; }
addEventListener("online", net); addEventListener("offline", net); net();

/* ---------- camera ---------- */
let qr = null, busy = false, lastCode = "", lastAt = 0;
async function startCam() {
  $("startBtn").classList.add("hidden");
  qr = qr || new Html5Qrcode("reader", { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], verbose: false });
  try {
    await qr.start({ facingMode: "environment" }, { fps: 12, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.75); return { width: s, height: s }; } }, onScan);
  } catch (e) {
    $("startBtn").classList.remove("hidden");
    $("warn").textContent = "Camera didn't start. Allow camera access for this site in your browser, then tap Start camera.";
    $("warn").classList.remove("hidden");
  }
}
async function stopCam() { try { if (qr && qr.isScanning) await qr.stop(); } catch (e) {} $("startBtn").classList.remove("hidden"); }
$("startBtn").onclick = startCam;

/* ---------- feedback ---------- */
let actx = null;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = ok ? 880 : 220; o.type = ok ? "sine" : "square";
    g.gain.value = 0.25; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (ok ? 0.15 : 0.5));
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 80 : [200, 100, 200]); } catch (e) {}
}
let hideTimer = null;
function show(kind, icon, title, detail, autoMs) {
  const r = $("result"); r.className = kind; $("rIcon").textContent = icon;
  $("rTitle").textContent = title; $("rDetail").innerHTML = detail;
  beep(kind === "ok");
  clearTimeout(hideTimer);
  if (autoMs) hideTimer = setTimeout(hide, autoMs);
}
function hide() { $("result").className = "hidden"; busy = false; }
$("result").onclick = hide;

/* ---------- validation ---------- */
async function fingerprint(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 12);
}
const timeout = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms));
const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

async function onScan(text) {
  const code = String(text).trim().toUpperCase();
  const now = Date.now();
  if (busy) return;
  if (code === lastCode && now - lastAt < 8000) return; // same ticket still in front of camera
  busy = true; lastCode = code; lastAt = now;

  const m = code.match(/^TKT-(\d{5})-[A-Z0-9]{8}$/);
  if (!m || !VALID.has(await fingerprint(code))) {
    show("bad", "✕", "NOT VALID", "This is not one of our tickets.<br>Do not admit — call the gate supervisor.");
    return;
  }
  const ticket = m[1];
  if (!db) { show("amber", "!", "VALID — NOT CHECKED", `Ticket ${ticket} is genuine, but the scanner isn't connected so it can't check if it was already used.`); return; }

  try {
    const ref = doc(db, "scans", code);
    const res = await Promise.race([
      runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if (snap.exists()) return { dup: true, d: snap.data() };
        tx.set(ref, { ticket, gate, scanner: +num, at: serverTimestamp(), atLocal: Date.now() });
        return { dup: false };
      }),
      timeout(7000)
    ]);
    if (res.dup) {
      show("bad", "✕", "ALREADY USED", `Ticket ${ticket} was scanned at <b>${res.d.gate}</b> (scanner ${res.d.scanner}) at <b>${fmtTime(res.d.atLocal)}</b>.<br>Do not admit — call the gate supervisor.`);
    } else {
      mine++; $("mine").textContent = mine; bumpCount();
      show("ok", "✓", "ADMIT", `Ticket ${ticket}`, 1600);
    }
  } catch (e) {
    show("amber", "!", "NO CONNECTION", `Ticket ${ticket} is genuine, but this phone couldn't reach the database to check if it was already used.<br>Check mobile data and scan again.`);
    lastCode = ""; // allow an immediate rescan
  }
}

/* ---------- counter ---------- */
let mine = 0, total = null;
function bumpCount() { if (total !== null) $("count").textContent = (++total).toLocaleString(); }
async function refreshCount() {
  if (!db) return;
  try { const c = await getCountFromServer(collection(db, "scans")); total = c.data().count; $("count").textContent = total.toLocaleString(); } catch (e) {}
}
setInterval(refreshCount, 120000); // every 2 min keeps well inside the free plan

/* ---------- boot ---------- */
if (gate && num) showScan(); else showSetup();
</script>
